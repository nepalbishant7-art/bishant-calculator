```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bishant Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #111827, #1e293b);
            padding: 20px;
        }

        .calculator {
            width: 390px;
            max-width: 100%;
            background: #111827;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .title {
            text-align: center;
            color: white;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .display {
            background: #020617;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            min-height: 110px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            overflow: hidden;
        }

        .previous {
            color: #94a3b8;
            font-size: 17px;
            min-height: 25px;
            text-align: right;
            word-break: break-all;
        }

        .current {
            color: white;
            font-size: 38px;
            text-align: right;
            word-break: break-all;
            min-height: 50px;
        }

        .memory {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .memory button {
            background: #334155;
            color: #e2e8f0;
            font-size: 14px;
            padding: 10px 5px;
            border-radius: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            border: none;
            outline: none;
            cursor: pointer;
            min-height: 58px;
            border-radius: 15px;
            background: #1e293b;
            color: white;
            font-size: 20px;
            font-weight: bold;
            transition: 0.15s;
        }

        button:hover {
            filter: brightness(1.2);
            transform: translateY(-1px);
        }

        button:active {
            transform: scale(0.94);
        }

        .function {
            background: #475569;
        }

        .operator {
            background: #2563eb;
        }

        .equals {
            background: #16a34a;
        }

        .danger {
            background: #dc2626;
        }

        .special {
            background: #7c3aed;
        }

        .zero {
            grid-column: span 2;
        }

        .history {
            margin-top: 18px;
            background: #020617;
            border-radius: 15px;
            padding: 12px;
            max-height: 160px;
            overflow-y: auto;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 8px;
        }

        .history-header button {
            min-height: auto;
            padding: 6px 10px;
            font-size: 12px;
            background: #dc2626;
            border-radius: 8px;
        }

        .history-item {
            color: #cbd5e1;
            font-size: 14px;
            padding: 7px;
            border-bottom: 1px solid #1e293b;
            cursor: pointer;
        }

        .history-item:hover {
            background: #1e293b;
        }

        .footer {
            text-align: center;
            color: #64748b;
            font-size: 12px;
            margin-top: 12px;
        }

        @media (max-width: 400px) {
            .calculator {
                padding: 14px;
            }

            button {
                min-height: 52px;
                font-size: 18px;
            }

            .current {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="calculator">

    <div class="title">Bishant Calculator</div>

    <!-- DISPLAY -->
    <div class="display">
        <div class="previous" id="previous"></div>
        <div class="current" id="current">0</div>
    </div>

    <!-- MEMORY -->
    <div class="memory">
        <button onclick="memoryClear()">MC</button>
        <button onclick="memoryRecall()">MR</button>
        <button onclick="memoryAdd()">M+</button>
        <button onclick="memorySubtract()">M−</button>
    </div>

    <!-- CALCULATOR BUTTONS -->
    <div class="buttons">

        <!-- Row 1 -->
        <button class="danger" onclick="clearAll()">AC</button>
        <button class="function" onclick="deleteLast()">DEL</button>
        <button class="function" onclick="percentage()">%</button>
        <button class="operator" onclick="chooseOperator('÷')">÷</button>

        <!-- Row 2 -->
        <button onclick="appendNumber('7')">7</button>
        <button onclick="appendNumber('8')">8</button>
        <button onclick="appendNumber('9')">9</button>
        <button class="operator" onclick="chooseOperator('×')">×</button>

        <!-- Row 3 -->
        <button onclick="appendNumber('4')">4</button>
        <button onclick="appendNumber('5')">5</button>
        <button onclick="appendNumber('6')">6</button>
        <button class="operator" onclick="chooseOperator('−')">−</button>

        <!-- Row 4 -->
        <button onclick="appendNumber('1')">1</button>
        <button onclick="appendNumber('2')">2</button>
        <button onclick="appendNumber('3')">3</button>
        <button class="operator" onclick="chooseOperator('+')">+</button>

        <!-- Row 5 -->
        <button class="zero" onclick="appendNumber('0')">0</button>
        <button onclick="appendDecimal()">.</button>
        <button class="equals" onclick="calculate()">=</button>

        <!-- Row 6 -->
        <button class="special" onclick="toggleSign()">+/-</button>
        <button class="special" onclick="square()">x²</button>
        <button class="special" onclick="squareRoot()">√</button>
        <button class="special" onclick="power()">xʸ</button>

        <!-- Row 7 -->
        <button class="function" onclick="appendParenthesis('(')">(</button>
        <button class="function" onclick="appendParenthesis(')')">)</button>
        <button class="function" onclick="reciprocal()">1/x</button>
        <button class="function" onclick="clearEntry()">CE</button>

    </div>

    <!-- HISTORY -->
    <div class="history">
        <div class="history-header">
            <strong>History</strong>
            <button onclick="clearHistory()">Clear</button>
        </div>

        <div id="historyList">
            No calculations yet.
        </div>
    </div>

    <div class="footer">
        Calculator • Keyboard Supported
    </div>

</div>


<script>

    let currentValue = "0";
    let previousValue = "";
    let operator = null;
    let resetScreen = false;

    let memory = 0;

    const currentDisplay = document.getElementById("current");
    const previousDisplay = document.getElementById("previous");
    const historyList = document.getElementById("historyList");


    /* =========================
       DISPLAY
    ========================= */

    function updateDisplay() {
        currentDisplay.textContent = currentValue;
        previousDisplay.textContent =
            operator && previousValue !== ""
                ? previousValue + " " + operator
                : "";
    }


    /* =========================
       NUMBER
    ========================= */

    function appendNumber(number) {

        if (currentValue === "Error") {
            currentValue = "0";
        }

        if (resetScreen) {
            currentValue = number;
            resetScreen = false;
        } else {
            if (currentValue === "0") {
                currentValue = number;
            } else {
                currentValue += number;
            }
        }

        updateDisplay();
    }


    /* =========================
       DECIMAL
    ========================= */

    function appendDecimal() {

        if (resetScreen) {
            currentValue = "0.";
            resetScreen = false;
            updateDisplay();
            return;
        }

        if (!currentValue.includes(".")) {
            currentValue += ".";
        }

        updateDisplay();
    }


    /* =========================
       OPERATOR
    ========================= */

    function chooseOperator(op) {

        if (currentValue === "Error") return;

        if (operator && !resetScreen) {
            calculate();
        }

        previousValue = currentValue;
        operator = op;
        resetScreen = true;

        updateDisplay();
    }


    /* =========================
       CALCULATE
    ========================= */

    function calculate() {

        if (!operator || previousValue === "") return;

        let a = parseFloat(previousValue);
        let b = parseFloat(currentValue);
        let result;

        try {

            switch (operator) {

                case "+":
                    result = a + b;
                    break;

                case "−":
                    result = a - b;
                    break;

                case "×":
                    result = a * b;
                    break;

                case "÷":

                    if (b === 0) {
                        throw new Error("Cannot divide by zero");
                    }

                    result = a / b;
                    break;

                default:
                    return;
            }

            result = formatNumber(result);

            addHistory(
                `${previousValue} ${operator} ${currentValue} = ${result}`
            );

            currentValue = result.toString();

            previousValue = "";
            operator = null;
            resetScreen = true;

            updateDisplay();

        } catch (error) {

            currentValue = "Error";
            previousValue = "";
            operator = null;

            updateDisplay();
        }
    }


    /* =========================
       FORMAT NUMBER
    ========================= */

    function formatNumber(number) {

        if (!Number.isFinite(number)) {
            return "Error";
        }

        return parseFloat(number.toFixed(12));
    }


    /* =========================
       CLEAR ALL
    ========================= */

    function clearAll() {

        currentValue = "0";
        previousValue = "";
        operator = null;
        resetScreen = false;

        updateDisplay();
    }


    /* =========================
       CLEAR ENTRY
    ========================= */

    function clearEntry() {

        currentValue = "0";

        updateDisplay();
    }


    /* =========================
       DELETE
    ========================= */

    function deleteLast() {

        if (currentValue === "Error") {
            clearAll();
            return;
        }

        if (currentValue.length <= 1) {
            currentValue = "0";
        } else {
            currentValue = currentValue.slice(0, -1);
        }

        updateDisplay();
    }


    /* =========================
       PERCENTAGE
    ========================= */

    function percentage() {

        let value = parseFloat(currentValue);

        if (isNaN(value)) return;

        currentValue = formatNumber(value / 100).toString();

        updateDisplay();
    }


    /* =========================
       PLUS / MINUS
    ========================= */

    function toggleSign() {

        if (currentValue === "0" || currentValue === "Error") return;

        if (currentValue.startsWith("-")) {
            currentValue = currentValue.substring(1);
        } else {
            currentValue = "-" + currentValue;
        }

        updateDisplay();
    }


    /* =========================
       SQUARE
    ========================= */

    function square() {

        let value = parseFloat(currentValue);

        if (isNaN(value)) return;

        currentValue = formatNumber(value * value).toString();

        updateDisplay();
    }


    /* =========================
       SQUARE ROOT
    ========================= */

    function squareRoot() {

        let value = parseFloat(currentValue);

        if (isNaN(value) || value < 0) {
            currentValue = "Error";
            updateDisplay();
            return;
        }

        currentValue = formatNumber(Math.sqrt(value)).toString();

        updateDisplay();
    }


    /* =========================
       POWER
    ========================= */

    function power() {

        let value = parseFloat(currentValue);

        if (isNaN(value)) return;

        previousValue = currentValue;
        operator = "^";
        resetScreen = true;

        updateDisplay();
    }


    /* =========================
       RECIPROCAL
    ========================= */

    function reciprocal() {

        let value = parseFloat(currentValue);

        if (value === 0 || isNaN(value)) {
            currentValue = "Error";
            updateDisplay();
            return;
        }

        currentValue = formatNumber(1 / value).toString();

        updateDisplay();
    }


    /* =========================
       PARENTHESES
    ========================= */

    function appendParenthesis(value) {

        if (currentValue === "0") {
            currentValue = value;
        } else {
            currentValue += value;
        }

        updateDisplay();
    }


    /* =========================
       MEMORY
    ========================= */

    function memoryClear() {

        memory = 0;
    }


    function memoryRecall() {

        currentValue = memory.toString();

        updateDisplay();
    }


    function memoryAdd() {

        let value = parseFloat(currentValue);

        if (!isNaN(value)) {
            memory += value;
        }
    }


    function memorySubtract() {

        let value = parseFloat(currentValue);

        if (!isNaN(value)) {
            memory -= value;
        }
    }


    /* =========================
       HISTORY
    ========================= */

    function addHistory(calculation) {

        if (historyList.textContent === "No calculations yet.") {
            historyList.innerHTML = "";
        }

        const item = document.createElement("div");

        item.className = "history-item";

        item.textContent = calculation;

        item.onclick = function () {

            let result = calculation.split("=")[1].trim();

            currentValue = result;

            updateDisplay();
        };

        historyList.prepend(item);
    }


    function clearHistory() {

        historyList.innerHTML =
            "No calculations yet.";
    }


    /* =========================
       KEYBOARD SUPPORT
    ========================= */

    document.addEventListener("keydown", function(event) {

        const key = event.key;

        if (key >= "0" && key <= "9") {
            appendNumber(key);
        }

        else if (key === ".") {
            appendDecimal();
        }

        else if (key === "+") {
            chooseOperator("+");
        }

        else if (key === "-") {
            chooseOperator("−");
        }

        else if (key === "*") {
            chooseOperator("×");
        }

        else if (key === "/") {
            event.preventDefault();
            chooseOperator("÷");
        }

        else if (key === "Enter" || key === "=") {
            calculate();
        }

        else if (key === "Backspace") {
            deleteLast();
        }

        else if (key === "Escape") {
            clearAll();
        }

        else if (key === "%") {
            percentage();
        }

        else if (key === "(" || key === ")") {
            appendParenthesis(key);
        }

    });


    /* =========================
       START
    ========================= */

    updateDisplay();

</script>

</body>
</html>
